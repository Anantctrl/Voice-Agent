[project]
name = "voice-agent-v2"
version = "0.2.0"
description = "Sub-500ms Real-Time Voice AI Agent (full-duplex)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "groq>=0.11.0",
    "pydantic-settings>=2.2.0",
    "colorama>=0.4.6",
    "pywebrtc-audio>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deliberately excluded: BLE (blind except is the realtime pattern around
# sockets/audio teardown) and S (bandit flags the same defensive handlers).
select = ["F", "I", "UP", "C4", "SIM", "RUF100", "RUF022", "RUF059"]
ignore = ["BLE", "S"]
