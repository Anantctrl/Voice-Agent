<!DOCTYPE html>
<!-- Single-page client: captures mic audio, negotiates WebRTC, plays AI voice,
     and shows live transcripts coming over the /events WebSocket.
     Mic auto-connects on page load; the assistant only activates when
     you say "Hey Jarvis" (wake word detection happens server-side). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceAI</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e6e6e6;
           max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-weight: 600; font-size: 1.5rem; }
    #status { display:inline-block; margin-left: 14px; padding: 6px 14px;
              border-radius: 999px; background:#1d2230; font-size:.9rem; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; max-width: 85%; }
    .user { background:#2b3660; margin-left:auto; text-align:right; }
    .ai   { background:#1e2433; }
    .log  { margin-top: 24px; display:flex; flex-direction:column; }
    #remoteAudio { display:none; }
  </style>
</head>
<body>
  <h1>🎙 VoiceAI</h1>
  <span id="status">connecting...</span>
  <div class="log" id="log"></div>
  <audio id="remoteAudio" autoplay playsinline></audio>

<script>
  const statusEl = document.getElementById("status");
  const log = document.getElementById("log");
  const remoteAudio = document.getElementById("remoteAudio");

  const labels = {
    waiting_for_wake_word: '🎤 Say "Hey Jarvis" to activate',
    listening:             "🎧 Listening for your question...",
    transcribing:          "📝 Transcribing...",
    thinking:              "🧠 Thinking...",
    speaking:              "🔊 Speaking...",
  };

  function setStatus(s) {
    statusEl.textContent = labels[s] || s;
    // Pulse the pill when waiting so the mic-active state is visually obvious.
    statusEl.className = (s === "waiting_for_wake_word") ? "pulse" : "";
  }

  // Track the current AI bubble so streaming sentences append to it
  // instead of creating a new bubble for every fragment.
  let currentAiDiv = null;

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    log.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  function startAiBubble() {
    currentAiDiv = addMsg("ai", "");
    return currentAiDiv;
  }

  function appendAiText(text) {
    if (!currentAiDiv) startAiBubble();
    currentAiDiv.textContent += (currentAiDiv.textContent ? " " : "") + text;
    window.scrollTo(0, document.body.scrollHeight);
  }

  // Auto-connect: mic opens and WebRTC negotiates as soon as the page loads,
  // so the user only needs to speak — no button click required.
  (async () => {
    const ws = new WebSocket(`ws://${location.host}/events`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "status") {
        setStatus(m.state);
        // When a new turn starts (thinking), reset the AI bubble tracker.
        if (m.state === "thinking") currentAiDiv = null;
      }
      if (m.type === "user") addMsg("user", m.text);
      if (m.type === "ai_stream") {
        // Each sentence arrives separately; append to the current bubble.
        if (!currentAiDiv) startAiBubble();
        appendAiText(m.text);
      }
      if (m.type === "ai") addMsg("ai", m.text);
    };

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });

    const pc = new RTCPeerConnection();
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    pc.ontrack = (e) => (remoteAudio.srcObject = e.streams[0]);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const res = await fetch("/offer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    const answer = await res.json();
    await pc.setRemoteDescription({ type: answer.type, sdp: answer.sdp });

    setStatus("waiting_for_wake_word");
  })();
</script>
</body>
</html>
